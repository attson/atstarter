name: build

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main, feature/*]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # gh-release upload needs this when a tag triggers the workflow

env:
  GO_VERSION: '1.23.12'
  NODE_VERSION: '20'
  WAILS_VERSION: 'v2.12.0'
  APP_ARTIFACT_NAME: 'Rootyard'

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install frontend deps
        working-directory: frontend
        run: npm ci

      # main.go has //go:embed all:frontend/dist — build the frontend before
      # any Go tooling touches the root package.
      - name: build frontend (populate embed target)
        working-directory: frontend
        run: npm run build

      - name: go test
        run: go test ./...

      - name: go test (runner race)
        run: go test -race ./internal/runner/

      # Expanded with find rather than a hand-maintained list: the previous list
      # had silently drifted and was missing three test files. Node 20 does not
      # accept a directory argument for --test, hence find.
      - name: frontend tests
        run: node --test $(find frontend/src -name '*.test.mjs' | sort)

      # The site build only runs after merge (pages.yml is push-to-main), so a
      # frontend import the demo mocks don't export used to break the docs site
      # with no pre-merge signal. This check is pure node — no site deps needed.
      - name: demo mock coverage
        run: node --test site/docs/.vitepress/theme/components/mockWailsCoverage.test.mjs

      - name: AI plugin manifest
        run: node scripts/validate-ai-plugin.mjs

      - name: npm launcher tests
        run: node --test $(find npm/rootyard-mcp/test -name '*.test.mjs' | sort)

  build-linux:
    name: linux/${{ matrix.arch }}
    needs: test
    runs-on: ${{ matrix.runner }}
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - name: install wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: install frontend deps
        working-directory: frontend
        run: npm ci

      - name: build frontend (populate embed target)
        working-directory: frontend
        run: npm run build

      - name: prepare release metadata
        if: startsWith(github.ref, 'refs/tags/v')
        run: node .github/scripts/set-wails-version.mjs wails.json "${GITHUB_REF_NAME#v}"

      - name: build
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
          UPDATE_VERIFY_PUBLIC_KEY: ${{ secrets.ROOTYARD_UPDATE_VERIFY_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          ldflags="-X main.Version=$VERSION"
          if [ -n "${UPDATE_VERIFY_PUBLIC_KEY:-}" ]; then
            ldflags="$ldflags -X main.UpdateVerifyPublicKey=$UPDATE_VERIFY_PUBLIC_KEY"
          fi
          wails build -tags webkit2_41 -platform linux/${{ matrix.arch }} -s -ldflags "$ldflags"

      - name: package tarball
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          cd build/bin
          tar -czf "Rootyard-linux-${{ matrix.arch }}.tar.gz" rootyard
          ls -la "Rootyard-linux-${{ matrix.arch }}.tar.gz"

      - name: package deb
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
          ARTIFACT_NAME: ${{ env.APP_ARTIFACT_NAME }}
        run: .github/scripts/package-linux-deb.sh

      - name: verify linux package commands
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          package="build/bin/${APP_ARTIFACT_NAME}_${GITHUB_REF_NAME#v}_${{ matrix.arch }}.deb"
          extracted="$(mktemp -d)"
          trap 'rm -rf "$extracted"' EXIT
          dpkg-deb --extract "$package" "$extracted"
          test -x "$extracted/usr/bin/rootyard"
          test ! -e "$extracted/usr/bin/Rootyard"
          test ! -L "$extracted/usr/bin/Rootyard"
          grep -Fx "Exec=rootyard" "$extracted/usr/share/applications/Rootyard.desktop"

      - uses: actions/upload-artifact@v6
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: Rootyard-linux-${{ matrix.arch }}
          path: |
            build/bin/${{ env.APP_ARTIFACT_NAME }}_*_${{ matrix.arch }}.deb
            build/bin/Rootyard-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  build-darwin:
    name: darwin/${{ matrix.arch }}
    needs: test
    runs-on: ${{ matrix.runner }}
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-15 }
          - { arch: amd64, runner: macos-15-intel }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: install frontend deps
        working-directory: frontend
        run: npm ci

      - name: build frontend
        working-directory: frontend
        run: npm run build

      - name: go test
        run: go test ./...

      - name: prepare release metadata
        if: startsWith(github.ref, 'refs/tags/v')
        run: node .github/scripts/set-wails-version.mjs wails.json "${GITHUB_REF_NAME#v}"

      - name: build
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
          UPDATE_VERIFY_PUBLIC_KEY: ${{ secrets.ROOTYARD_UPDATE_VERIFY_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          ldflags="-X main.Version=$VERSION"
          if [ -n "${UPDATE_VERIFY_PUBLIC_KEY:-}" ]; then
            ldflags="$ldflags -X main.UpdateVerifyPublicKey=$UPDATE_VERIFY_PUBLIC_KEY"
          fi
          wails build -platform darwin/${{ matrix.arch }} -s -ldflags "$ldflags"

      - name: package .app zip
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          cd build/bin
          # Wails names the bundle after wails.json:name (rootyard). Copy to the
          # user-facing product name before archiving so /Applications shows
          # "Rootyard" both in Finder and via `ls`.
          if [ ! -d "Rootyard.app" ]; then
            cp -R rootyard.app "Rootyard.app"
          fi
          ditto -c -k --keepParent "Rootyard.app" "Rootyard-darwin-${{ matrix.arch }}.zip"
          ls -la "Rootyard-darwin-${{ matrix.arch }}.zip"

      - name: package dmg
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
          ARTIFACT_NAME: ${{ env.APP_ARTIFACT_NAME }}
        run: .github/scripts/package-macos-dmg.sh

      - name: verify macOS installer payload
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          dmg="build/bin/${APP_ARTIFACT_NAME}_${GITHUB_REF_NAME#v}_${{ matrix.arch }}.dmg"
          work="$(mktemp -d)"
          mount="$work/mount"
          expanded="$work/expanded"
          mkdir -p "$mount"
          cleanup() {
            hdiutil detach "$mount" -quiet -force >/dev/null 2>&1 || true
            rm -rf "$work"
          }
          trap cleanup EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          test -f "$mount/Rootyard.pkg"
          test ! -d "$mount/Rootyard.app"
          pkgutil --expand-full "$mount/Rootyard.pkg" "$expanded"
          test -x "$expanded/Payload/Applications/Rootyard.app/Contents/MacOS/rootyard"
          test -L "$expanded/Payload/usr/local/bin/rootyard"
          test "$(readlink "$expanded/Payload/usr/local/bin/rootyard")" = "/Applications/Rootyard.app/Contents/MacOS/rootyard"

      - uses: actions/upload-artifact@v6
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: Rootyard-darwin-${{ matrix.arch }}
          path: |
            build/bin/${{ env.APP_ARTIFACT_NAME }}_*_${{ matrix.arch }}.dmg
            build/bin/Rootyard-darwin-${{ matrix.arch }}.zip
          if-no-files-found: error

  build-windows:
    name: windows/amd64
    needs: test
    runs-on: windows-2022
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || '' }}
    defaults:
      run:
        shell: bash # Git Bash so recipes match the unix jobs
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install NSIS
        run: |
          choco install nsis -y --no-progress
          echo "C:\\Program Files (x86)\\NSIS" >> "$GITHUB_PATH"

      - name: test PATH helper
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File build/windows/installer/update-path.ps1 -SelfTest

      - name: install wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: install frontend deps
        working-directory: frontend
        run: npm ci

      - name: build frontend
        working-directory: frontend
        run: npm run build

      - name: prepare release metadata
        if: startsWith(github.ref, 'refs/tags/v')
        run: node .github/scripts/set-wails-version.mjs wails.json "${GITHUB_REF_NAME#v}"

      - name: build NSIS installer
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
          UPDATE_VERIFY_PUBLIC_KEY: ${{ secrets.ROOTYARD_UPDATE_VERIFY_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          ldflags="-X main.Version=$VERSION"
          if [ -n "${UPDATE_VERIFY_PUBLIC_KEY:-}" ]; then
            ldflags="$ldflags -X main.UpdateVerifyPublicKey=$UPDATE_VERIFY_PUBLIC_KEY"
          fi
          wails build -platform windows/amd64 -nsis -s -ldflags "$ldflags"

      - name: package .exe zip
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          cd build/bin
          test -f "rootyard.exe"
          7z a "Rootyard-windows-amd64.zip" "rootyard.exe"
          ls -la "Rootyard-windows-amd64.zip"

      - name: rename installer
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ github.ref_name }}
          ARTIFACT_NAME: ${{ env.APP_ARTIFACT_NAME }}
        run: |
          set -euo pipefail
          version_no_v="${VERSION#v}"
          src=""
          # NSIS names the installer after wails.json:name (rootyard);
          # cover a few plausible variants in case that changes.
          for candidate in \
            "build/bin/rootyard-amd64-installer.exe" \
            "build/bin/Rootyard-amd64-installer.exe"; do
            if [ -f "$candidate" ]; then
              src="$candidate"
              break
            fi
          done
          if [ -z "$src" ]; then
            echo "windows installer not found; listing build/bin"
            ls -la build/bin
            exit 1
          fi
          dst="build/bin/${ARTIFACT_NAME}_${version_no_v}_amd64.exe"
          mv "$src" "$dst"
          ls -la "$dst"

      - uses: actions/upload-artifact@v6
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: Rootyard-windows-amd64
          path: |
            build/bin/${{ env.APP_ARTIFACT_NAME }}_*_amd64.exe
            build/bin/Rootyard-windows-amd64.zip
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-darwin, build-windows]
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: sign checksums
        env:
          ROOTYARD_UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.ROOTYARD_UPDATE_SIGNING_PRIVATE_KEY }}
        run: go run .github/scripts/sign-release-checksums.go artifacts

      - name: list
        run: find artifacts -type f | sort

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true

  publish-npm:
    name: publish npm launcher
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      # Package version follows the release tag (v0.5.35 -> 0.5.35) so each tag
      # publishes a fresh version and never collides with a prior publish.
      - name: set package version from tag
        working-directory: npm/rootyard-mcp
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: publish
        working-directory: npm/rootyard-mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
